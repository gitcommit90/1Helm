name: Candidate dress rehearsal

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 1helm-dress-rehearsal
  cancel-in-progress: false

# Normal pushes only run CI. To rehearse one exact main commit, set the
# HELM_DRESS_REHEARSAL_SHA repository variable to its full 40-character SHA
# before that commit's CI run finishes. The dedicated Mac and Windows runner
# hooks already trust only this successful-CI workflow_run path.
jobs:
  build:
    name: Build Linux candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == vars.HELM_DRESS_REHEARSAL_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact_name }}
      commit: ${{ steps.package.outputs.commit }}
      version: ${{ steps.package.outputs.version }}
      archive-sha256: ${{ steps.package.outputs.archive_sha256 }}
      offline-sha256: ${{ steps.package.outputs.offline_sha256 }}
      image-sha256: ${{ steps.package.outputs.image_sha256 }}
      image-bytes: ${{ steps.package.outputs.image_bytes }}
      image-name: ${{ steps.package.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the two Linux archives
        id: package
        env:
          HELM_CANDIDATE_REPOSITORY: ${{ github.repository }}
          HELM_CANDIDATE_REF: refs/heads/main
          HELM_CANDIDATE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          HELM_CANDIDATE_SOURCE_STATE: trusted-main
          HELM_CANDIDATE_BUILD_ID: rehearsal-${{ github.run_id }}.${{ github.run_attempt }}
          HELM_CANDIDATE_CREATED_AT: ${{ github.event.workflow_run.updated_at }}
          HELM_CANDIDATE_CI_WORKFLOW: CI
          HELM_CANDIDATE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          HELM_CANDIDATE_CI_CONCLUSION: success
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HELM_CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci
          sudo apt-get update
          sudo apt-get install -y podman
          npm run package:channel-image
          npm run package:linux

          version="$(node -p 'require("./package.json").version')"
          archive="dist/1Helm-$version-linux-node.tgz"
          offline="dist/1Helm-$version-linux-node-offline.tgz"
          image_meta="container/channel-machine.oci.json"
          test -s "$archive"
          test -s "$offline"
          test -s "$image_meta"
          printf 'artifact_name=1helm-rehearsal-%s\n' "$HELM_CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$HELM_CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'offline_sha256=%s\n' "$(sha256sum "$offline" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'image_sha256=%s\n' "$(node -p 'require("./container/channel-machine.oci.json").sha256')" >> "$GITHUB_OUTPUT"
          printf 'image_bytes=%s\n' "$(node -p 'require("./container/channel-machine.oci.json").bytes')" >> "$GITHUB_OUTPUT"
          printf 'image_name=%s\n' "$(node -p 'require("./container/channel-machine.oci.json").artifact.name')" >> "$GITHUB_OUTPUT"

      - name: Share the exact Linux bytes with the test computers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/1Helm-*-linux-node.tgz
            dist/1Helm-*-linux-node-offline.tgz
          if-no-files-found: error
          retention-days: 7

  accept-linux:
    name: Linux install, update, start, data, and uninstall
    needs: build
    runs-on: [1helm-linux-phase4]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate-download

      - name: Test the real Linux host
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          HELM_CANDIDATE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          HELM_CANDIDATE_OFFLINE_SHA256: ${{ needs.build.outputs.offline-sha256 }}
        run: |
          set -euo pipefail
          export HELM_CANDIDATE_ARCHIVE="$(find candidate-download -maxdepth 1 -type f -name '1Helm-*-linux-node.tgz' -print -quit)"
          export HELM_CANDIDATE_OFFLINE_ARCHIVE="$(find candidate-download -maxdepth 1 -type f -name '1Helm-*-linux-node-offline.tgz' -print -quit)"
          test -n "$HELM_CANDIDATE_ARCHIVE"
          test -n "$HELM_CANDIDATE_OFFLINE_ARCHIVE"
          bash ops/platform-acceptance/linux.sh

  accept-windows:
    name: Windows install, update, start, data, and uninstall
    needs: build
    runs-on: [1helm-windows-phase4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate-download

      - name: Test the real Windows WSL install
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          HELM_CANDIDATE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
          HELM_CANDIDATE_OFFLINE_SHA256: ${{ needs.build.outputs.offline-sha256 }}
          HELM_CHANNEL_IMAGE_SHA256: ${{ needs.build.outputs.image-sha256 }}
          HELM_CHANNEL_IMAGE_BYTES: ${{ needs.build.outputs.image-bytes }}
          HELM_CHANNEL_IMAGE_NAME: ${{ needs.build.outputs.image-name }}
        run: |
          $env:HELM_CANDIDATE_ARCHIVE = Get-ChildItem candidate-download -Filter '1Helm-*-linux-node.tgz' | Select-Object -First 1 -ExpandProperty FullName
          $env:HELM_CANDIDATE_OFFLINE_ARCHIVE = Get-ChildItem candidate-download -Filter '1Helm-*-linux-node-offline.tgz' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $env:HELM_CANDIDATE_ARCHIVE -or -not $env:HELM_CANDIDATE_OFFLINE_ARCHIVE) { throw 'Linux candidate archives are missing.' }
          & .\ops\platform-acceptance\windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  accept-macos:
    name: Mac build, install, update, start, and data
    needs: build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == vars.HELM_DRESS_REHEARSAL_SHA
    runs-on: [1helm-macos-phase4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build, sign, notarize, and staple the Mac app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test -z "$(git status --porcelain)"
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci
          npm run package:dmg:release

      - name: Test the real Mac app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          HELM_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          HELM_MAC_CANDIDATE_DOWNLOAD: dist
        run: bash ops/platform-acceptance/macos.sh

  result:
    name: Three-computer result
    needs: [build, accept-linux, accept-windows, accept-macos]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report one plain result
        env:
          BUILD: ${{ needs.build.result }}
          LINUX: ${{ needs.accept-linux.result }}
          WINDOWS: ${{ needs.accept-windows.result }}
          MACOS: ${{ needs.accept-macos.result }}
        run: |
          {
            echo '## 1Helm dress rehearsal'
            echo
            echo "- Build: $BUILD"
            echo "- Linux: $LINUX"
            echo "- Windows: $WINDOWS"
            echo "- Mac: $MACOS"
            echo
            echo 'Stable/public release touched: no'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$BUILD" = success
          test "$LINUX" = success
          test "$WINDOWS" = success
          test "$MACOS" = success
