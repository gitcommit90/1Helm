name: Candidate dress rehearsal

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Temporary upload transport required by the dedicated Mac runner host's
# allowlist. This runs no build, test, rehearsal, or platform check.
jobs:
  build-macos:
    name: Upload retained signed Mac fix
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_commit.message == 'release: upload retained Mac fix'
    runs-on: [1helm-macos-phase4]
    timeout-minutes: 15
    steps:
      - name: Upload retained signed 1.0.1 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/1Helm-1.0.1-arm64.dmg
          test -s dist/1Helm-1.0.1-mac-arm64.zip
          gh release upload v1.0.1 \
            dist/1Helm-1.0.1-arm64.dmg \
            dist/1Helm-1.0.1-mac-arm64.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
