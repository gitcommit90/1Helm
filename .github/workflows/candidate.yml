name: Candidate dress rehearsal

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Temporary Mac build transport required by the dedicated runner's host
# allowlist. This performs no test, rehearsal, platform matrix, or publication.
jobs:
  build-macos:
    name: Build, sign and notarize the Mac fix
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_commit.message == 'release: sign Mac fix'
    runs-on: [1helm-macos-phase4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false
      - name: Build, sign, notarize and upload 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_CLOUDFLARED_CACHE_DIR: ${{ runner.temp }}/../1helm-release-cache
        run: |
          set -euo pipefail
          npm run package:dmg:release
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' 'Fixes the Mac application interface failing to load because generated frontend assets were omitted from version 1.0.0.' >"$notes"
          gh release create v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title '1Helm 1.0.1' --notes-file "$notes" --draft 2>/dev/null || \
          gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title '1Helm 1.0.1' --notes-file "$notes"
          gh release upload v1.0.1 \
            dist/1Helm-1.0.1-arm64.dmg \
            dist/1Helm-1.0.1-mac-arm64.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
