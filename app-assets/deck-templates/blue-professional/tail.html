

  </div>

  <!-- Navigation -->
  <div class="slide-counter"><span id="current">1</span> / <span id="total">10</span></div>
  <div class="keyboard-hint">Use arrow keys to navigate</div>
  <div class="progress-bar" id="progress"></div>
  <div class="nav-controls">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)" aria-label="Previous slide">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)" aria-label="Next slide">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');
    const progressEl = document.getElementById('progress');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let current = 0;
    const total = slides.length;
    totalEl.textContent = total;

    function updateSlide() {
      slides.forEach((slide, i) => {
        slide.classList.remove('active', 'prev');
        if (i === current) {
          slide.classList.add('active');
        } else if (i < current) {
          slide.classList.add('prev');
        }
      });
      currentEl.textContent = current + 1;
      progressEl.style.width = ((current + 1) / total * 100) + '%';
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;
    }

    function changeSlide(dir) {
      const next = current + dir;
      if (next >= 0 && next < total) {
        current = next;
        updateSlide();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        changeSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        changeSlide(-1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        current = 0;
        updateSlide();
      } else if (e.key === 'End') {
        e.preventDefault();
        current = total - 1;
        updateSlide();
      }
    });

    // Touch support
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        changeSlide(diff > 0 ? 1 : -1);
      }
    }, { passive: true });

    updateSlide();
  </script>

</body>
</html>
