<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck</title>
<style>
/* =============================================
   RAW GRID — Neobrutalist Presentation Template
   ============================================= */

/* --- RESET & BASE --- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --pink: #f2d4cf;
  --green: #e5edd6;
  --gray: #f5f5f5;
  --darkgray: #333333;
  --border: 3px solid var(--black);
  --shadow: 6px 6px 0 var(--black);
  --shadow-sm: 4px 4px 0 var(--black);
}
html, body {
  width: 100%; height: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
  background: var(--white);
  color: var(--black);
  overflow: hidden;
}

/* --- SLIDE SYSTEM --- */
.slide-deck {
  width: 100vw; height: 100vh;
  position: relative;
  overflow: hidden;
}
.slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  background: var(--white);
  overflow: hidden;
}
.slide.active { display: flex; }
.slide-content {
  width: 100%; height: 100%;
  overflow: hidden;
}

/* --- TYPOGRAPHY --- */
.t-display {
  font-size: clamp(48px, 7vw, 96px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.t-headline {
  font-size: clamp(32px, 4.5vw, 64px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.t-title {
  font-size: clamp(24px, 2.5vw, 36px);
  font-weight: 800;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.t-subtitle {
  font-size: clamp(16px, 1.4vw, 22px);
  font-weight: 700;
  line-height: 1.3;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.t-body {
  font-size: clamp(16px, 1.3vw, 20px);
  font-weight: 500;
  line-height: 1.6;
}
.t-caption {
  font-size: clamp(11px, 1vw, 13px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.t-number {
  font-size: clamp(64px, 8vw, 120px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.04em;
}

/* --- UTILITIES --- */
.b { border: var(--border); }
.b-t { border-top: var(--border); }
.b-b { border-bottom: var(--border); }
.b-l { border-left: var(--border); }
.b-r { border-right: var(--border); }
.bg-pink { background: var(--pink); }
.bg-green { background: var(--green); }
.bg-black { background: var(--black); }
.bg-gray { background: var(--gray); }
.bg-white { background: var(--white); }
.c-white { color: var(--white); }
.c-black { color: var(--black); }
.pad-lg { padding: clamp(32px, 4vw, 64px); }
.pad-md { padding: clamp(20px, 2.5vw, 40px); }
.pad-sm { padding: clamp(12px, 1.5vw, 20px); }
.shadow { box-shadow: var(--shadow); }
.shadow-sm { box-shadow: var(--shadow-sm); }
.w-100 { width: 100%; }
.h-100 { height: 100%; }
.flex { display: flex; }
.col { flex-direction: column; }
.center { align-items: center; justify-content: center; }
.grow { flex: 1; }
.gap-sm { gap: clamp(8px, 1vw, 16px); }
.gap-md { gap: clamp(16px, 2vw, 32px); }
.gap-lg { gap: clamp(24px, 3vw, 48px); }
.arrow::before { content: "\2192\00a0"; }
.grid { display: grid; }

/* --- SPECIAL COMPONENTS --- */
.label {
  display: inline-block;
  background: var(--black);
  color: var(--white);
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.line {
  width: 60px;
  height: 4px;
  background: var(--black);
}
.line-w { width: 100%; }
.line-v {
  width: 4px;
  height: 60px;
  background: var(--black);
}

/* =============================================
   SLIDE 1 — TITLE / COVER
   ============================================= */
.s1 .slide-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100%;
}
.s1-left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(32px, 4vw, 64px);
  background: var(--pink);
  border-right: var(--border);
}
.s1-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.s1-logo-box {
  width: 48px; height: 48px;
  border: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 900;
  background: var(--white);
}
.s1-brand-text {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.02em;
}
.s1-headline { margin-top: auto; margin-bottom: auto; }
.s1-cta .label { cursor: pointer; }
.s1-right {
  display: flex;
  flex-direction: column;
}
.s1-list-item {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 clamp(24px, 3vw, 48px);
  border-bottom: var(--border);
  font-size: clamp(18px, 2vw, 28px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: background 0.15s;
}
.s1-list-item:last-child { border-bottom: none; }
.s1-list-item:hover { background: var(--green); }
.s1-list-item::before {
  content: "\2192\00a0";
  margin-right: 12px;
  font-size: 0.85em;
}

/* =============================================
   SLIDE 2 — SPLIT FEATURE
   ============================================= */
.s2 .slide-content {
  display: grid;
  grid-template-columns: 45% 55%;
  height: 100%;
}
.s2-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 4vw, 64px);
  border-right: var(--border);
}
.s2-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: clamp(24px, 3vw, 48px);
}
.s2-right {
  display: grid;
  grid-template-rows: 1fr 1fr;
}
.s2-block {
  padding: clamp(24px, 3vw, 48px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.s2-block:first-child { border-bottom: var(--border); }

/* =============================================
   SLIDE 3 — DATA BAR CHART
   ============================================= */
.s3 .slide-content {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.s3-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: clamp(20px, 2vw, 32px) clamp(32px, 4vw, 64px);
  border-bottom: var(--border);
}
.s3-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.s3-chart-area {
  padding: clamp(24px, 3vw, 48px);
  border-right: var(--border);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.s3-chart-title {
  margin-bottom: 24px;
}
.s3-bar-group {
  margin-bottom: 20px;
}
.s3-bar-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.s3-bar-track {
  width: 100%;
  height: 32px;
  border: var(--border);
  background: var(--white);
  position: relative;
}
.s3-bar-fill {
  height: 100%;
  display: flex;
  align-items: center;
  padding-left: 10px;
  font-size: 12px;
  font-weight: 800;
  transition: width 0.8s ease;
}
.s3-bar-fill.pink { background: var(--pink); }
.s3-bar-fill.green { background: var(--green); }
.s3-bar-fill.black { background: var(--black); color: var(--white); }
.s3-insights {
  padding: clamp(24px, 3vw, 48px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(16px, 2vw, 32px);
}
.s3-stat-box {
  border: var(--border);
  padding: clamp(16px, 2vw, 28px);
  background: var(--white);
}
.s3-stat-number {
  font-size: clamp(36px, 4vw, 56px);
  font-weight: 900;
  line-height: 1;
  margin-bottom: 8px;
}
.s3-stat-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* =============================================
   SLIDE 4 — 4-CARD GRID
   ============================================= */
.s4 .slide-content {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.s4-header {
  padding: clamp(20px, 2vw, 32px) clamp(32px, 4vw, 64px);
  border-bottom: var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.s4-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.s4-card {
  padding: clamp(24px, 3vw, 48px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.s4-card:nth-child(1) { border-right: var(--border); border-bottom: var(--border); background: var(--white); }
.s4-card:nth-child(2) { border-bottom: var(--border); background: var(--green); }
.s4-card:nth-child(3) { border-right: var(--border); background: var(--pink); }
.s4-card:nth-child(4) { background: var(--gray); }
.s4-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.s4-num {
  font-size: clamp(40px, 5vw, 72px);
  font-weight: 900;
  line-height: 1;
  opacity: 0.35;
}
.s4-icon {
  width: 48px; height: 48px;
  border: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
  background: var(--white);
}

/* =============================================
   SLIDE 5 — FULL IMAGE + TEXT OVERLAY
   ============================================= */
.s5 .slide-content {
  display: grid;
  grid-template-columns: 55% 45%;
  height: 100%;
}
.s5-image-area {
  background: var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.s5-image-placeholder {
  width: 80%;
  height: 70%;
  border: 4px solid var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  opacity: 0.6;
}
.s5-text-area {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 4vw, 64px);
  background: var(--white);
}
.s5-badge {
  align-self: flex-start;
  margin-bottom: clamp(24px, 3vw, 40px);
}

/* =============================================
   SLIDE 6 — TIMELINE / PROCESS
   ============================================= */
.s6 .slide-content {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.s6-header {
  padding: clamp(20px, 2vw, 32px) clamp(32px, 4vw, 64px);
  border-bottom: var(--border);
}
.s6-body {
  flex: 1;
  display: flex;
  padding: 0 clamp(32px, 4vw, 64px);
}
.s6-step {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: clamp(24px, 3vw, 48px) clamp(16px, 2vw, 28px);
  position: relative;
}
.s6-step + .s6-step { border-left: var(--border); }
.s6-step-num {
  font-size: clamp(48px, 6vw, 80px);
  font-weight: 900;
  line-height: 1;
  margin-bottom: clamp(16px, 2vw, 28px);
  opacity: 0.2;
}
.s6-step-title { margin-bottom: 12px; }
.s6-connector {
  position: absolute;
  top: clamp(40px, 5vw, 64px);
  right: -18px;
  width: 32px; height: 32px;
  border: var(--border);
  background: var(--black);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  z-index: 10;
}
.s6-step:nth-child(1) .s6-step-num { color: var(--black); }
.s6-step:nth-child(2) .s6-step-num { color: var(--black); }
.s6-step:nth-child(3) { background: var(--green); }
.s6-step:nth-child(4) { background: var(--pink); }

/* =============================================
   SLIDE 7 — PIE / DONUT CHART + METRICS
   ============================================= */
.s7 .slide-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100%;
}
.s7-left {
  padding: clamp(32px, 4vw, 64px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border-right: var(--border);
}
.s7-donut-container {
  position: relative;
  width: clamp(200px, 22vw, 320px);
  height: clamp(200px, 22vw, 320px);
  margin-bottom: clamp(24px, 3vw, 40px);
}
.s7-donut-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.s7-donut-value {
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 900;
  line-height: 1;
}
.s7-donut-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 4px;
}
.s7-legend {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  justify-content: center;
}
.s7-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
}
.s7-legend-swatch {
  width: 16px; height: 16px;
  border: var(--border);
}
.s7-right {
  display: flex;
  flex-direction: column;
}
.s7-metric-row {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 clamp(32px, 4vw, 64px);
  border-bottom: var(--border);
}
.s7-metric-row:last-child { border-bottom: none; }
.s7-metric-num {
  font-size: clamp(36px, 4vw, 56px);
  font-weight: 900;
  min-width: 120px;
}
.s7-metric-info { margin-left: clamp(16px, 2vw, 32px); }
.s7-metric-title { margin-bottom: 4px; }

/* =============================================
   SLIDE 8 — STATEMENT / QUOTE
   ============================================= */
.s8 .slide-content {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.s8-top {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 4vw, 64px);
  background: var(--green);
  border-bottom: var(--border);
  position: relative;
}
.s8-quote-mark {
  position: absolute;
  top: clamp(20px, 3vw, 40px);
  left: clamp(32px, 4vw, 64px);
  font-size: clamp(80px, 12vw, 160px);
  font-weight: 900;
  line-height: 1;
  opacity: 0.15;
}
.s8-statement {
  position: relative;
  z-index: 2;
  max-width: 900px;
}
.s8-bottom {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: 140px;
}
.s8-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  border-right: var(--border);
}
.s8-stat:last-child { border-right: none; }
.s8-stat-num {
  font-size: clamp(24px, 2.5vw, 36px);
  font-weight: 900;
  margin-bottom: 4px;
}
.s8-stat:nth-child(1) { background: var(--white); }
.s8-stat:nth-child(2) { background: var(--pink); }
.s8-stat:nth-child(3) { background: var(--gray); }
.s8-stat:nth-child(4) { background: var(--black); color: var(--white); }

/* =============================================
   SLIDE 9 — COMPARISON TABLE
   ============================================= */
.s9 .slide-content {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.s9-header {
  padding: clamp(20px, 2vw, 32px) clamp(32px, 4vw, 64px);
  border-bottom: var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.s9-table-wrap {
  flex: 1;
  padding: clamp(24px, 3vw, 48px) clamp(32px, 4vw, 64px);
  overflow: auto;
}
.s9-table {
  width: 100%;
  border-collapse: collapse;
}
.s9-table th {
  border: var(--border);
  padding: clamp(12px, 1.5vw, 20px);
  font-size: clamp(12px, 1.1vw, 14px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: left;
  background: var(--black);
  color: var(--white);
}
.s9-table td {
  border: var(--border);
  padding: clamp(12px, 1.5vw, 20px);
  font-size: clamp(14px, 1.2vw, 17px);
  font-weight: 600;
}
.s9-table tr:nth-child(even) td { background: var(--gray); }
.s9-table tr:hover td { background: var(--green); }

/* =============================================
   SLIDE 10 — CLOSING / CTA
   ============================================= */
.s10 .slide-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100%;
}
.s10-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 4vw, 64px);
  background: var(--pink);
  border-right: var(--border);
}
.s10-right {
  display: flex;
  flex-direction: column;
}
.s10-r-top {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 4vw, 64px);
  border-bottom: var(--border);
}
.s10-r-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100px;
}
.s10-rb-block {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.s10-rb-block:first-child { border-right: var(--border); background: var(--green); }
.s10-rb-block:last-child { background: var(--black); color: var(--white); }

/* =============================================
   PRINT
   ============================================= */
@media print {
  /* print styles */
  .slide { position: static; display: flex !important; page-break-after: always; }
}
</style>
</head>
<body>

<div class="slide-deck" id="deck">

<!-- ====== SLIDE 1: COVER ====== -->
