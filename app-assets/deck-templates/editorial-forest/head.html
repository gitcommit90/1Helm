<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Deck</title>
<!--hc-fonts-->
<script src="hc-lib:deck-stage.js"></script>
<style>
  :root {
    --green: #2e4a2a;
    --green-deep: #243a21;
    --green-lite: #3a5a36;
    --pink: #e89cb1;
    --pink-deep: #d27e96;
    --cream: #efe7d4;
    --cream-2: #e6dcc4;
    --ink: #1a1a17;
    --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; background: #111; }
  deck-stage { font-family: var(--serif); color: var(--ink); }

  section {
    box-sizing: border-box;
    width: 1920px;
    height: 1080px;
    padding: 96px 120px;
    background: var(--cream);
    color: var(--ink);
    position: relative;
    overflow: hidden;
  }

  .label {
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ============ 01 — Cover ============ */
  .cover {
    background: var(--green);
    color: var(--pink);
    padding: 100px 140px;
  }
  .cover .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--pink);
  }
  .cover .topbar .label { color: var(--pink); }
  .cover .mark {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px solid var(--pink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: 0.1em;
    font-weight: 500;
  }
  .cover h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 220px;
    line-height: 0.92;
    letter-spacing: -0.02em;
    margin: 40px 0 0 0;
  }
  .cover .footline {
    position: absolute;
    bottom: 80px;
    left: 140px;
    right: 140px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 28px;
    color: var(--pink);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ============ 02 — Agenda (tiles) ============ */
  .agenda {
    background: var(--cream);
    padding: 90px 120px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 36px;
  }
  .agenda .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 40px;
  }
  .agenda h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 96px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    color: var(--green);
    margin: 0;
    white-space: nowrap;
  }
  .agenda .head .label { color: var(--green); white-space: nowrap; }
  .agenda-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 24px;
  }
  .topic {
    border-radius: 6px;
    position: relative;
    padding: 40px 40px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 0;
  }
  .topic.t-green { background: var(--green); color: var(--pink); grid-row: span 2; }
  .topic.t-pink { background: var(--pink); color: var(--green-deep); }
  .topic.t-greenLite { background: var(--green-lite); color: var(--pink); }
  .topic.t-cream { background: var(--cream-2); color: var(--green); border: 2px solid var(--green); }
  .topic .num {
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.14em;
    font-weight: 500;
  }
  .topic h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 56px;
    line-height: 0.98;
    letter-spacing: -0.01em;
    margin: 28px 0 0 0;
  }
  .topic.t-green h3 { font-size: 84px; }
  .topic p {
    font-family: var(--serif);
    font-size: 26px;
    line-height: 1.32;
    margin: 16px 0 0 0;
    max-width: 100%;
    font-weight: 400;
  }
  .topic .foot {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    margin-top: 20px;
  }

  /* ============ 03 — Statement (big idea) ============ */
  .statement {
    background: var(--pink);
    color: var(--green-deep);
    padding: 130px 160px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .statement .label { color: var(--green-deep); }
  .statement blockquote {
    margin: 48px 0 0 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 140px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    max-width: 1560px;
  }
  .statement .attrib {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 60px;
    font-family: var(--mono);
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 500;
    gap: 60px;
  }
  .statement .attrib > div { display: flex; flex-direction: column; gap: 14px; white-space: nowrap; }
  .statement .attrib .name {
    font-family: var(--serif);
    font-size: 44px;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 600;
    line-height: 1;
  }

  /* ============ 04 — Two-column with image ============ */
  .two-col {
    background: var(--cream);
    display: grid;
    grid-template-columns: 880px 1fr;
    gap: 100px;
    align-items: stretch;
    padding: 110px 120px;
  }
  .two-col .col-img {
    background: var(--green);
    color: var(--pink);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .two-col .col-img .figure {
    font-family: var(--serif);
    font-size: 56px;
    color: var(--pink);
    font-weight: 500;
    text-align: center;
    padding: 0 40px;
    line-height: 1.05;
  }
  .two-col .col-img .caption {
    position: absolute;
    bottom: 36px;
    left: 36px;
    right: 36px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--pink);
  }
  .two-col .col-text { display: flex; flex-direction: column; padding-top: 8px; }
  .two-col .eyebrow {
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 500;
    margin-bottom: 32px;
  }
  .two-col h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 96px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    color: var(--green);
    margin: 0 0 40px 0;
  }
  .two-col p {
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1.38;
    color: var(--ink);
    margin: 0 0 24px 0;
    max-width: 760px;
    font-weight: 400;
    text-wrap: pretty;
  }
  .two-col .meta {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 36px;
    border-top: 2px solid var(--green);
    padding-top: 32px;
  }
  .two-col .meta dt {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .two-col .meta dd {
    font-family: var(--serif);
    font-size: 32px;
    color: var(--ink);
    margin: 0;
    font-weight: 500;
  }

  /* ============ 05 — Data / chart ============ */
  .data { background: var(--green); color: var(--cream); padding: 100px 120px; }
  .data .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 60px;
  }
  .data .head .label { color: var(--pink); }
  .data h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 84px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--cream);
    margin: 16px 0 0 0;
    max-width: 1200px;
  }
  .data .legend {
    display: flex;
    gap: 36px;
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.1em;
    color: var(--cream);
    text-transform: uppercase;
    font-weight: 500;
    white-space: nowrap;
  }
  .data .legend .sw {
    display: inline-block;
    width: 26px;
    height: 26px;
    margin-right: 12px;
    vertical-align: -4px;
    border-radius: 2px;
  }
  .chart {
    margin-top: 110px;
    height: 520px;
    display: grid;
    grid-template-columns: 80px 1fr;
    grid-template-rows: 1fr 60px;
    column-gap: 24px;
  }
  .chart .yaxis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--cream);
    text-align: right;
    padding-right: 8px;
    font-weight: 500;
  }
  .chart .plot {
    position: relative;
    border-left: 2px solid var(--cream);
    border-bottom: 2px solid var(--cream);
    padding: 0 30px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 30px;
  }
  .chart .grid-lines {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(to top, transparent 0 calc(25% - 1px), rgba(239,231,212,0.18) calc(25% - 1px) 25%);
    pointer-events: none;
  }
  .bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; gap: 8px; }
  .bar-pair { display: flex; align-items: flex-end; gap: 12px; height: 100%; width: 100%; justify-content: center; }
  .bar { width: 56px; border-radius: 3px 3px 0 0; position: relative; }
  .bar.a { background: var(--pink); }
  .bar.b { background: var(--cream); }
  .bar .val {
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 24px;
    color: var(--cream);
    font-weight: 500;
  }
  .chart .xlabel-row {
    grid-column: 2;
    display: flex;
    justify-content: space-between;
    padding: 18px 30px 0;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--cream);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .chart .xlabel { flex: 1; text-align: center; }
  .data .footnote {
    position: absolute;
    bottom: 60px;
    left: 120px;
    right: 120px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--pink);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ============ 06 — Framework / 4 steps ============ */
  .framework { background: var(--cream); padding: 100px 120px; }
  .framework .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 40px;
  }
  .framework .head .label { color: var(--green); white-space: nowrap; }
  .framework h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 96px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    color: var(--green);
    margin: 24px 0 0 0;
    max-width: 1500px;
  }
  .flow {
    margin-top: 70px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px;
    align-items: stretch;
  }
  .step {
    border-radius: 8px;
    padding: 40px 32px 32px;
    display: flex;
    flex-direction: column;
    min-height: 470px;
    border: 2.5px solid var(--green);
    background: var(--cream);
    color: var(--green);
  }
  .step.fill { background: var(--green); color: var(--pink); border-color: var(--green); }
  .step.pinkfill { background: var(--pink); color: var(--green-deep); border-color: var(--pink-deep); }
  .step .num {
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.16em;
    font-weight: 500;
  }
  .step h3 {
    font-family: var(--serif);
    font-size: 68px;
    line-height: 0.96;
    letter-spacing: -0.01em;
    font-weight: 500;
    margin: 24px 0 24px 0;
  }
  .step p {
    font-family: var(--serif);
    font-size: 26px;
    line-height: 1.34;
    margin: 0;
    font-weight: 400;
  }
  .step .marker {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 24px;
    border-top: 2px solid currentColor;
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ============ 07 — Big stats / KPI callouts ============ */
  .stats { background: var(--green); color: var(--cream); padding: 100px 120px; }
  .stats .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 40px;
  }
  .stats .head .label { color: var(--pink); white-space: nowrap; }
  .stats h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 80px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: var(--cream);
    margin: 18px 0 0 0;
    max-width: 1400px;
  }
  .kpi-row {
    margin-top: 80px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 60px;
    border-top: 2px solid var(--pink);
    padding-top: 56px;
  }
  .kpi { display: flex; flex-direction: column; gap: 16px; }
  .kpi .tag {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pink);
    font-weight: 500;
  }
  .kpi .big {
    font-family: var(--serif);
    font-size: 220px;
    line-height: 0.92;
    letter-spacing: -0.03em;
    color: var(--pink);
    font-weight: 500;
  }
  .kpi .big .unit {
    font-size: 110px;
    color: var(--cream);
    margin-left: 4px;
  }
  .kpi .desc {
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1.32;
    color: var(--cream);
    margin: 8px 0 0 0;
    font-weight: 400;
  }

  /* ============ 08 — Summary / closing ============ */
  .summary { background: var(--green); color: var(--cream); padding: 110px 140px; }
  .summary .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .summary .topbar .label { color: var(--pink); }
  .summary h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 220px;
    line-height: 0.94;
    letter-spacing: -0.02em;
    color: var(--pink);
    margin: 50px 0 0 0;
  }
  .summary .grid-cols {
    margin-top: 70px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 60px;
    border-top: 2px solid var(--pink);
    padding-top: 36px;
  }
  .summary .grid-cols h4 {
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pink);
    margin: 0 0 18px 0;
    font-weight: 500;
  }
  .summary .grid-cols p {
    font-family: var(--serif);
    font-size: 32px;
    line-height: 1.32;
    margin: 0;
    color: var(--cream);
    font-weight: 400;
  }

</style>
</head>
<body>

<deck-stage aspect="1920/1080" no-rail>

  <!-- ============ 01 — Cover ============ -->
