<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Connect 1Helm</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17191d; background: #f5f3ec; }
    * { box-sizing: border-box; } body { min-height: 100dvh; margin: 0; padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom)); display: grid; place-items: center; }
    main { width: min(100%, 25rem); padding: 1.5rem; border: 1px solid #d9d5ca; border-radius: 1rem; background: #fff; box-shadow: 0 24px 60px -42px #000; }
    .mark { display: block; width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 1rem; object-fit: cover; }
    h1 { margin: 0; font-size: 1.6rem; text-align: center; } p { margin: .6rem 0 1.25rem; color: #68655e; font-size: .9rem; line-height: 1.55; text-align: center; }
    label { display: block; margin-bottom: .4rem; font-size: .75rem; font-weight: 700; } input, button { width: 100%; min-height: 3rem; border-radius: .65rem; font: inherit; }
    input { border: 1px solid #c9c5ba; padding: .75rem; background: #fff; color: #17191d; } button { margin-top: .75rem; border: 0; padding: .7rem 1rem; background: #ef5b2a; color: #fff; font-weight: 750; }
    .workspace-field { display: flex; min-height: 3rem; overflow: hidden; border: 1px solid #c9c5ba; border-radius: .65rem; background: #fff; }
    .workspace-field input { min-width: 0; border: 0; border-radius: 0; text-align: right; outline: none; }
    .workspace-field:focus-within { border-color: #ef5b2a; box-shadow: 0 0 0 3px color-mix(in srgb, #ef5b2a 18%, transparent); }
    .suffix { display: flex; align-items: center; padding: 0 .8rem 0 0; color: #77736b; font-weight: 650; white-space: nowrap; }
    .alternate { min-height: auto; margin-top: .7rem; padding: .25rem; background: transparent; color: #68655e; font-size: .78rem; font-weight: 650; }
    button:disabled { opacity: .6; } #status { min-height: 1.25rem; margin: .65rem 0 0; color: #a23024; font-size: .78rem; text-align: left; }
    small { display: block; margin-top: .85rem; color: #77736b; font-size: .7rem; line-height: 1.5; text-align: center; }
    @media (prefers-color-scheme: dark) { :root { color: #f4f2eb; background: #111318; } main { border-color: #34373e; background: #191c22; } p, small, .alternate { color: #a8a59d; } input, .workspace-field { border-color: #3d4149; background: #121419; color: #f4f2eb; } .suffix { color: #a8a59d; } }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="1helm-logo.png" alt="1Helm">
    <h1>1Helm</h1>
    <p>Sign in to 1HC, or connect to your own 1Helm deployment.</p>
    <button id="cloud" type="button">Continue to 1HC</button>
    <form id="connect" hidden>
      <label for="server">Self-hosted address</label>
      <input id="server" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://your-1helm-server.com" required>
      <button id="submit" type="submit">Connect</button>
    </form>
    <button id="alternate" class="alternate" type="button">Connect to your own server</button>
    <div id="status" role="alert"></div>
    <small>Only the selected HTTPS origin receives native bridge access. Other links open outside the app.</small>
  </main>
  <script src="capacitor.js"></script>
  <script>
    const form = document.getElementById("connect");
    const input = document.getElementById("server");
    const submit = document.getElementById("submit");
    const alternate = document.getElementById("alternate");
    const cloud = document.getElementById("cloud");
    const status = document.getElementById("status");
    const gateway = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.InstanceGateway;
    const cloudOrigin = "https://app.1helm.com";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const splash = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
      if (splash) splash.hide({ fadeOutDuration: 180 }).catch(() => {});
    }));
    const normalize = (value) => {
      const raw = value.trim();
      const parsed = new URL(raw.includes("://") ? raw : `https://${raw}`);
      if (parsed.protocol !== "https:" || parsed.username || parsed.password || parsed.search || parsed.hash || (parsed.pathname !== "/" && parsed.pathname !== "")) throw new Error("Enter an HTTPS root address without a path, credentials, query, or fragment.");
      return parsed.origin;
    };
    const showCustomUrl = (custom, value = "") => {
      form.hidden = !custom;
      cloud.hidden = custom;
      input.value = value;
      alternate.textContent = custom ? "Back to 1HC" : "Connect to your own server";
      status.textContent = "";
      if (custom) input.focus();
    };
    alternate.addEventListener("click", () => showCustomUrl(form.hidden, input.value));
    gateway && gateway.getServer().then(({ origin }) => {
      if (origin && origin !== cloudOrigin) showCustomUrl(true, origin);
    }).catch(() => {});
    const connect = async (origin, button) => {
      status.textContent = ""; button.disabled = true; button.textContent = "Checking…";
      try {
        if (!gateway) throw new Error("The native connection service is unavailable. Reinstall this 1Helm app.");
        const response = await fetch(`${origin}/api/mobile/compatibility`, { cache: "no-store" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.product !== "1Helm" || result.mobile_api !== 1) throw new Error("That address is not a compatible 1Helm instance.");
        if (!result.has_users || !result.setup_complete) throw new Error("Finish setting up this 1Helm instance before connecting the app.");
        button.textContent = "Opening…";
        await gateway.selectServer({ origin });
      } catch (error) { status.textContent = error && error.message ? error.message : "Could not connect to this instance."; button.disabled = false; button.textContent = button === cloud ? "Continue to 1HC" : "Connect"; }
    };
    cloud.addEventListener("click", () => connect(cloudOrigin, cloud));
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      try { void connect(normalize(input.value), submit); }
      catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
